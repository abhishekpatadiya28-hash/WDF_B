<!DOCTYPE html>
<html>
<head>
    <title>School Events</title>
    <link rel="stylesheet" href="Event.css">
</head>

<body>

    <h1>School Events</h1>

    <input type="text" id="search" placeholder="Search event">

    <select id="sort">

    </select>

    <div id="events"></div>

    <div id="pagination"></div>

    <script src="Event.js"></script>

</body>
</html>
